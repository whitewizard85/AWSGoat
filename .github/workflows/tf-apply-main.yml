name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        description: Select which module to deploy
        options:
          - module-1
          - module-2
        required: true

permissions: write-all

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1

    defaults:
      run:
        shell: bash

    steps:
    # ------------------------------------------------------------
    # Checkout
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------------------------------------
    # Terraform setup
    # ------------------------------------------------------------
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.10.5

    # ------------------------------------------------------------
    # Resolve AWS Account ID
    # ------------------------------------------------------------
    - name: Set AWS Account ID
      run: |
        echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

    # ------------------------------------------------------------
    # Ensure S3 bucket for Terraform state exists
    # ------------------------------------------------------------
    - name: Ensure Terraform state S3 bucket exists
      run: |
        BUCKET="do-not-delete-awsgoat-state-files-${ACCOUNT_ID}"

        echo "Checking S3 bucket: $BUCKET"

        if aws s3 ls "s3://$BUCKET" >/dev/null 2>&1; then
          echo "Bucket already exists"
        else
          echo "Bucket does not exist, creating"

          if [ "$AWS_REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$BUCKET"
          else
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi

          echo "Bucket created"
        fi

    # ------------------------------------------------------------
    # Terraform init
    # ------------------------------------------------------------
    - name: Terraform Init
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform init

    # ------------------------------------------------------------
    # AUTO-IMPORT: recover from partial executions
    # ------------------------------------------------------------
    - name: Auto-import existing AWS resources into Terraform state
      run: |
        cd modules/${{ github.event.inputs.module }}

        import_if_missing () {
          ADDRESS="$1"
          IMPORT_ID="$2"

          if terraform state show "$ADDRESS" >/dev/null 2>&1; then
            echo "✔ $ADDRESS already in state"
          else
            echo "➜ Importing $ADDRESS"
            terraform import "$ADDRESS" "$IMPORT_ID" || echo "⚠ Import failed, continuing"
          fi
        }

        # IAM Policies
        import_if_missing \
          aws_iam_policy.ecs_instance_policy \
          arn:aws:iam::${ACCOUNT_ID}:policy/aws-goat-instance-policy

        import_if_missing \
          aws_iam_policy.instance_boundary_policy \
          arn:aws:iam::${ACCOUNT_ID}:policy/aws-goat-instance-boundary-policy

        # DB Subnet Group
        import_if_missing \
          aws_db_subnet_group.database-subnet-group \
          database-subnets

        # Secrets Manager
        import_if_missing \
          aws_secretsmanager_secret.rds_creds \
          RDS_CREDS

    # ------------------------------------------------------------
    # Terraform plan
    # ------------------------------------------------------------
    - name: Terraform Plan
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform plan -input=false

    # ------------------------------------------------------------
    # Terraform apply
    # ------------------------------------------------------------
    - name: Terraform Apply
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform apply -auto-approve -input=false

    # ------------------------------------------------------------
    # Upload local state to S3 (only if it exists)
    # ------------------------------------------------------------
    - name: Upload terraform.tfstate to S3
      if: always()
      run: |
        cd modules/${{ github.event.inputs.module }}

        if [ -f terraform.tfstate ]; then
          aws s3 cp terraform.tfstate \
            s3://do-not-delete-awsgoat-state-files-${ACCOUNT_ID}/terraform.tfstate
        else
          echo "terraform.tfstate not found, skipping upload"
        fi

    # ------------------------------------------------------------
    # Terraform outputs
    # ------------------------------------------------------------
    - name: Terraform Outputs
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform output
