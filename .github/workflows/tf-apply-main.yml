name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        description: Select which module to deploy
        options:
          - module-1
          - module-2
        required: true

permissions: write-all

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1

    defaults:
      run:
        shell: bash

    steps:
    # ------------------------------------------------------------
    # Checkout
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------------------------------------
    # Terraform setup
    # ------------------------------------------------------------
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.10.5

    # ------------------------------------------------------------
    # Resolve AWS Account ID
    # ------------------------------------------------------------
    - name: Set AWS Account ID
      run: |
        echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

    # ------------------------------------------------------------
    # Ensure S3 bucket for Terraform state exists
    # ------------------------------------------------------------
    - name: Ensure Terraform state S3 bucket exists
      run: |
        BUCKET="do-not-delete-awsgoat-state-files-${ACCOUNT_ID}"

        echo "Checking S3 bucket: $BUCKET"

        if aws s3 ls "s3://$BUCKET" >/dev/null 2>&1; then
          echo "Bucket already exists"
        else
          echo "Bucket does not exist, creating"

          if [ "$AWS_REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$BUCKET"
          else
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi

          echo "Bucket created"
        fi

    # ------------------------------------------------------------
    # Check for existing deployment (state already present)
    # ------------------------------------------------------------
    - name: Check previous AWSGoat deployment
      id: check
      continue-on-error: true
      run: |
        aws s3api head-object \
          --bucket "do-not-delete-awsgoat-state-files-${ACCOUNT_ID}" \
          --key "terraform.tfstate"

    - name: Abort if previous deployment exists
      if: steps.check.outcome == 'success'
      run: |
        echo "A previous AWSGoat deployment already exists."
        echo "Run the Terraform Destroy workflow before applying again."
        exit 1

    # ------------------------------------------------------------
    # Terraform init
    # ------------------------------------------------------------
    - name: Terraform Init
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform init

    # ------------------------------------------------------------
    # Terraform plan
    # ------------------------------------------------------------
    - name: Terraform Plan
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform plan -input=false

    # ------------------------------------------------------------
    # Optional cleanup: remove ghost IAM role from state
    # ------------------------------------------------------------
    - name: Remove ghost IAM role from state (if present)
      run: |
        cd modules/${{ github.event.inputs.module }}

        if [ -f terraform.tfstate ]; then
          terraform state rm aws_iam_role.goat_role || echo "Role not in state, skipping"
        else
          echo "No local state file, skipping state cleanup"
        fi

    # ------------------------------------------------------------
    # Terraform apply
    # ------------------------------------------------------------
    - name: Terraform Apply
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform apply -auto-approve -input=false

    # ------------------------------------------------------------
    # Upload Terraform state to S3 (only if it exists)
    # ------------------------------------------------------------
    - name: Upload terraform.tfstate to S3
      if: always()
      run: |
        cd modules/${{ github.event.inputs.module }}

        if [ -f terraform.tfstate ]; then
          aws s3 cp terraform.tfstate \
            s3://do-not-delete-awsgoat-state-files-${ACCOUNT_ID}/terraform.tfstate
        else
          echo "terraform.tfstate not found, skipping upload"
        fi

    # ------------------------------------------------------------
    # Terraform outputs
    # ------------------------------------------------------------
    - name: Terraform Outputs
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform output
