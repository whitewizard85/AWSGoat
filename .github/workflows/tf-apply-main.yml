name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        description: Select which module to deploy
        options:
          - module-1
          - module-2
        required: true

permissions: write-all

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1

    defaults:
      run:
        shell: bash

    steps:
    # ------------------------------------------------------------
    # Checkout
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------------------------------------
    # Terraform setup
    # ------------------------------------------------------------
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.10.5

    # ------------------------------------------------------------
    # Set AWS Account ID
    # ------------------------------------------------------------
    - name: Set AWS Account ID
      run: |
        echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

    # ------------------------------------------------------------
    # Ensure Terraform state S3 bucket exists
    # ------------------------------------------------------------
    - name: Ensure Terraform state S3 bucket exists
      run: |
        BUCKET="do-not-delete-awsgoat-state-files-${ACCOUNT_ID}"

        if aws s3 ls "s3://$BUCKET" >/dev/null 2>&1; then
          echo "Bucket already exists"
        else
          if [ "$AWS_REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$BUCKET"
          else
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          fi
        fi

    # ------------------------------------------------------------
    # Terraform init
    # ------------------------------------------------------------
    - name: Terraform Init
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform init

    # ------------------------------------------------------------
    # Auto-import existing AWS resources (VPC-safe)
    # ------------------------------------------------------------
    - name: Auto-import existing AWS resources
      run: |
        cd modules/${{ github.event.inputs.module }}

        import_if_missing () {
          ADDRESS="$1"
          IMPORT_ID="$2"
          if terraform state show "$ADDRESS" >/dev/null 2>&1; then
            echo "✔ $ADDRESS already in state"
          else
            echo "➜ Importing $ADDRESS"
            terraform import "$ADDRESS" "$IMPORT_ID" || echo "⚠ Import failed, continuing"
          fi
        }

        # ------------------------------
        # VPC: check by tag or name and import
        # ------------------------------
        VPC_NAME="lab-vpc"
        EXISTING_VPC_ID=$(aws ec2 describe-vpcs \
          --filters "Name=tag:Name,Values=${VPC_NAME}" \
          --query "Vpcs[0].VpcId" --output text 2>/dev/null || echo "")

        if [ -n "$EXISTING_VPC_ID" ]; then
          echo "✔ Found existing VPC $VPC_NAME ($EXISTING_VPC_ID), importing"
          terraform import aws_vpc.lab-vpc "$EXISTING_VPC_ID"
        else
          echo "➜ No existing VPC found, Terraform will create one"
        fi

        # ------------------------------
        # IAM Policies
        # ------------------------------
        import_if_missing aws_iam_policy.ecs_instance_policy arn:aws:iam::${ACCOUNT_ID}:policy/aws-goat-instance-policy
        import_if_missing aws_iam_policy.instance_boundary_policy arn:aws:iam::${ACCOUNT_ID}:policy/aws-goat-instance-boundary-policy

        # ------------------------------
        # IAM Roles
        # ------------------------------
        import_if_missing aws_iam_role.ecs-instance-role ecs-instance-role

        # ------------------------------
        # Secrets Manager
        # ------------------------------
        import_if_missing aws_secretsmanager_secret.rds_creds RDS_CREDS

        # ------------------------------
        # DB Subnet Group (auto-import or create unique name)
        # ------------------------------
        DB_SUBNET_GROUP_NAME="database-subnets-${{ github.event.inputs.module }}"
        if terraform state show aws_db_subnet_group.database-subnet-group >/dev/null 2>&1; then
          echo "✔ DB Subnet Group already in state"
        else
          if aws rds describe-db-subnet-groups --db-subnet-group-name database-subnets >/dev/null 2>&1; then
            echo "➜ database-subnets exists in AWS, importing"
            terraform import aws_db_subnet_group.database-subnet-group database-subnets
          else
            echo "➜ DB Subnet Group does not exist, will create as $DB_SUBNET_GROUP_NAME"
            echo "DB_SUBNET_GROUP_NAME=$DB_SUBNET_GROUP_NAME" >> $GITHUB_ENV
          fi
        fi

    # ------------------------------------------------------------
    # Terraform plan
    # ------------------------------------------------------------
    - name: Terraform Plan
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform plan -input=false

    # ------------------------------------------------------------
    # Terraform apply
    # ------------------------------------------------------------
    - name: Terraform Apply
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform apply -auto-approve -input=false

    # ------------------------------------------------------------
    # Upload local state to S3 (only if it exists)
    # ------------------------------------------------------------
    - name: Upload terraform.tfstate to S3
      if: always()
      run: |
        cd modules/${{ github.event.inputs.module }}
        if [ -f terraform.tfstate ]; then
          aws s3 cp terraform.tfstate \
            s3://do-not-delete-awsgoat-state-files-${ACCOUNT_ID}/terraform.tfstate
        fi

    # ------------------------------------------------------------
    # Terraform outputs
    # ------------------------------------------------------------
    - name: Terraform Outputs
      run: |
        cd modules/${{ github.event.inputs.module }}
        terraform output
